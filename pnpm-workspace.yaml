minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - fastify@5.8.5

autoInstallPeers: false
engineStrict: true

# CI installs the manifest pin; keep the lockfile compatible with GitHub dependency updates.
pmOnFail: ignore

allowBuilds:
  esbuild: false

autoDedupe: true
lockfile:
  includeResolutionSettings: true
