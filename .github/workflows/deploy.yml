name: deploy

on:
  workflow_run:
    workflows:
      - ci
    branches:
      - main
    types:
      - completed

permissions:
  contents: read
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref_name }}
  queue: max
  cancel-in-progress: false

jobs:
  neon-pgschema-apply:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: production
      deployment: false

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: ./.github/actions/pgschema
        env:
          PGHOST: ${{ vars.NEON_HOST }}
          PGPORT: "5432"
          PGDATABASE: ${{ vars.NEON_DATABASE_NAME || 'neondb' }}
          PGUSER: ${{ vars.NEON_ROLE_NAME || 'neondb_owner' }}
          PGPASSWORD: ${{ secrets.NEON_OWNER_PASSWORD }}
        with:
          pgschema-package-version: v1.9.0
          pgschema-package: github.com/pgplex/pgschema
          file: db/neon.sql

  fly-deploy:
    needs:
      - neon-pgschema-apply
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: production

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.26

      - run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
