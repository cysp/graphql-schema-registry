name: pgschema-apply
description: Run pgschema to apply schema changes.

inputs:
  schema:
    description: Target Postgres schema name.
    required: false
    default: public
  file:
    description: Path to the schema SQL file.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.26.x"
    - shell: bash
      env:
        PGSCHEMA_SCHEMA: ${{ inputs.schema }}
        PGSCHEMA_FILE: ${{ inputs.file }}
      run: |
        go run github.com/pgplex/pgschema@v1.13.1 apply \
          --schema "${PGSCHEMA_SCHEMA}" \
          --file "${PGSCHEMA_FILE}" \
          --auto-approve
